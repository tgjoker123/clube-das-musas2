packages:
  - "apps/*"
  - "packages/*"


# Pacotes com scripts de instalação (postinstall/preinstall) — cada um
# avaliado explicitamente por segurança (nunca "allow all").
allowBuilds:
  # Baixa o binário do motor de query do Prisma — necessário para
  # `prisma generate`/`migrate` funcionarem.
  '@prisma/engines': true
  # Telemetria de instalação anônima usada pelo Prisma — desabilitada.
  '@scarf/scarf': false
  prisma: true
  # Build nativo de otimização de imagem do Next.js — não necessário
  # nesta fase (nenhuma imagem sendo processada ainda).
  sharp: false
  unrs-resolver: false
