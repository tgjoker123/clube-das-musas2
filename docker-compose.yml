# Infraestrutura de DESENVOLVIMENTO LOCAL apenas.
# Em staging/produção, Postgres é o Supabase gerenciado e Redis é o Upstash
# (ver docs/00_ARQUITETURA.md §6 e §8) — este compose existe só para
# permitir rodar apps/api localmente sem depender de um projeto Supabase.
name: clube-das-musas

services:
  postgres:
    image: postgres:16-alpine
    container_name: musas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clube_das_musas
    ports:
      - "5432:5432"
    volumes:
      - musas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: musas-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - musas_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  musas_postgres_data:
  musas_redis_data:
